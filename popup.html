<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GridGrader</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand"><img src="icons/icon32.png" alt=""><span>GridGrader</span></div>
    <div id="pageTitle" class="page-title">Scanning page…</div>
  </header>

  <div class="controls">
    <input id="search" type="search" placeholder="Filter by name or student…">
    <div id="chips" class="chips"></div>
  </div>

  <div id="list" class="list"></div>

  <div id="empty" class="empty" hidden>
    <p><strong>No files found on this page.</strong></p>
    <p>Turn on <em>Include all links</em> below, or open an empty grid and drag downloaded files into it.</p>
  </div>

  <footer>
    <div class="range" id="rangeRow" title="Select only files #from to #to of the list above">
      <span>Open files</span>
      <input type="number" id="rFrom" min="1" value="1" aria-label="From">
      <span>to</span>
      <input type="number" id="rTo" min="1" value="1" aria-label="To">
      <span class="of" id="rOf"></span>
      <button id="rApply" class="ghost">Select range</button>
    </div>
    <div class="row">
      <label class="check"><input type="checkbox" id="selectAll" checked> Select all</label>
      <label class="check" title="Also list links that don't look like files"><input type="checkbox" id="includeAll"> Include all links</label>
    </div>
    <button id="open" class="primary">Open in grid</button>
  </footer>

  <script src="types.js"></script>
  <script src="scanner.js"></script>
  <script src="popup.js"></script>
</body>
</html>
