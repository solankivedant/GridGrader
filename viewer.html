<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GridGrader</title>
<link rel="icon" href="icons/icon32.png">
<link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header class="bar">
    <div class="left">
      <div class="brand"><img src="icons/icon32.png" alt=""><span>GridGrader</span></div>
      <span class="divider"></span>
      <div class="titles">
        <div class="title" id="title">Untitled grid</div>
        <a class="source" id="source" target="_blank" rel="noopener"></a>
      </div>
    </div>
    <div class="tools">
      <label class="field search" data-tip="Search">
        <i data-icon="search" data-size="16"></i>
        <input type="search" id="search" placeholder="Search students or files" aria-label="Search">
      </label>
      <label class="field select" data-tip="File type">
        <select id="kindFilter" aria-label="File type"><option value="">All types</option></select>
        <i data-icon="chevron" data-size="14"></i>
      </label>
      <div class="seg">
        <label class="slider" data-tip="Columns">
          <i data-icon="columns" data-size="16"></i>
          <input type="range" id="cols" min="1" max="6" step="1" value="3" aria-label="Columns">
          <b id="colsVal">3</b>
        </label>
        <span class="seg-div"></span>
        <label class="slider" data-tip="Tile height">
          <i data-icon="height" data-size="16"></i>
          <input type="range" id="height" min="220" max="1000" step="20" value="440" aria-label="Tile height">
        </label>
      </div>
      <button id="addFiles" class="ibtn" data-tip="Add files" aria-label="Add files"><i data-icon="add"></i></button>
      <input type="file" id="fileInput" multiple hidden>
      <div class="menu">
        <button class="ibtn" id="moreBtn" data-tip="More" aria-label="More actions"><i data-icon="more"></i></button>
        <div class="menu-pop" id="morePop" hidden>
          <button id="dlAll"><i data-icon="zip" data-size="16"></i>Download all as ZIP</button>
          <button id="exportNotes"><i data-icon="sheet" data-size="16"></i>Export marks (CSV)</button>
          <button id="reloadAll"><i data-icon="retry" data-size="16"></i>Retry failed files</button>
          <hr>
          <button id="clearNotes" class="danger"><i data-icon="eraser" data-size="16"></i>Clear all notes</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div id="status" class="status"></div>
    <div id="grid" class="grid"></div>
    <div id="emptyState" class="empty-state" hidden>
      <div class="empty-ic"><i data-icon="upload" data-size="34"></i></div>
      <h2>Drop files to start grading</h2>
      <p>Drag any number of files here (PDF, Word, Excel, images, video, audio, ZIP, STL/OBJ, Logisim) to view them side by side.</p>
      <p class="sub">Or click the GridGrader icon on a page of submissions to load them automatically.</p>
      <button class="primary" id="emptyAdd"><i data-icon="add" data-size="16"></i>Choose files</button>
    </div>
  </main>

  <div id="dropOverlay" class="drop-overlay" hidden><div><i data-icon="upload" data-size="28"></i>Drop to add files</div></div>

  <div id="modal" class="modal" hidden>
    <div class="side-grip" id="sideGrip" data-tip="Drag to resize" aria-hidden="true"></div>
    <div class="modal-head">
      <div class="navgrp">
        <button class="ibtn" id="prev" data-tip="Previous" data-key="←" aria-label="Previous file"><i data-icon="prev"></i></button>
        <span class="pos" id="mPos"></span>
        <button class="ibtn" id="next" data-tip="Next" data-key="→" aria-label="Next file"><i data-icon="next"></i></button>
      </div>
      <div class="modal-titles">
        <div class="mctx" id="mCtx"></div>
        <div class="mname" id="mName"></div>
      </div>
      <label class="field notefield" data-tip="Marks / note">
        <i data-icon="note" data-size="15"></i>
        <input class="note" id="mNote" placeholder="Marks / note" aria-label="Marks or note">
      </label>
      <button class="ibtn" id="mOpen" data-tip="New tab" aria-label="Open in a new tab"><i data-icon="external"></i></button>
      <button class="ibtn" id="mDl" data-tip="Download" aria-label="Download"><i data-icon="download"></i></button>
      <button class="ibtn" id="mMode" aria-label="Switch view"></button>
      <span class="divider"></span>
      <button class="ibtn" id="close" data-tip="Close" data-key="Esc" aria-label="Close"><i data-icon="close"></i></button>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>

  <script src="lib/jszip.min.js"></script>
  <script src="lib/docx-preview.min.js"></script>
  <script src="lib/xlsx.full.min.js"></script>
  <script src="types.js"></script>
  <script src="ui.js"></script>
  <script type="module" src="viewer.js"></script>
</body>
</html>
