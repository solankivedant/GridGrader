<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GridGrader</title>
<link rel="icon" href="icons/icon32.png">
<link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header class="bar">
    <div class="left">
      <img src="icons/icon32.png" class="logo" alt="">
      <div class="titles">
        <div class="title" id="title">GridGrader</div>
        <a class="source" id="source" target="_blank" rel="noopener"></a>
      </div>
    </div>
    <div class="tools">
      <input type="search" id="search" placeholder="Search name / student…">
      <select id="kindFilter" title="Show only this type"><option value="">All types</option></select>
      <label class="slider" title="Columns">
        <span>Columns</span>
        <input type="range" id="cols" min="1" max="6" step="1" value="3">
        <b id="colsVal">3</b>
      </label>
      <label class="slider" title="Tile height">
        <span>Height</span>
        <input type="range" id="height" min="220" max="1000" step="20" value="440">
      </label>
      <button id="addFiles" class="btn" title="Add files from your computer">+ Add files</button>
      <input type="file" id="fileInput" multiple hidden>
      <div class="menu">
        <button class="btn" id="moreBtn">More ▾</button>
        <div class="menu-pop" id="morePop" hidden>
          <button id="dlAll">Download all as ZIP</button>
          <button id="exportNotes">Export marks/notes (CSV)</button>
          <button id="reloadAll">Retry failed files</button>
          <button id="clearNotes">Clear notes for these files</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div id="status" class="status"></div>
    <div id="grid" class="grid"></div>
    <div id="emptyState" class="empty-state" hidden>
      <div class="drop-art">⬚⬚<br>⬚⬚</div>
      <h2>Drop files here</h2>
      <p>Drag any number of files (PDF, Word, Excel, images, video, audio, code, ZIP, STL/OBJ, Logisim .circ) onto this page to view them side by side.<br>
      Or click the GridGrader icon on a page full of submissions to load them automatically.</p>
    </div>
  </main>

  <div id="dropOverlay" class="drop-overlay" hidden><div>Drop to add files</div></div>

  <div id="modal" class="modal" hidden>
    <div class="modal-head">
      <button class="btn icon" id="prev" title="Previous file (←)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span>Prev</span></button>
      <div class="modal-titles">
        <div class="mctx" id="mCtx"></div>
        <div class="mname" id="mName"></div>
      </div>
      <input class="note" id="mNote" placeholder="Marks / note">
      <a class="btn" id="mOpen" target="_blank" rel="noopener">Open original ↗</a>
      <button class="btn" id="mDl">Download</button>
      <button class="btn icon" id="next" title="Next file (→)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg><span>Next</span></button>
      <button class="btn icon" id="close" title="Close large view (Esc)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg><span>Close</span></button>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>

  <script src="lib/jszip.min.js"></script>
  <script src="lib/docx-preview.min.js"></script>
  <script src="lib/xlsx.full.min.js"></script>
  <script src="types.js"></script>
  <script type="module" src="viewer.js"></script>
</body>
</html>
